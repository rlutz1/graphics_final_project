  <script type="module">
    // import test
    // import * from './util/primitives/sphere.js';
    import * as SphereGen from "./util/primitives/sphere.js";
    import { SceneGraph } from "./util/scene_graph.js";    

   
    // WebGL setup
    const canvas = document.getElementById("glcanvas");
    const gl = canvas.getContext("webgl2");
    if (!gl) alert("WebGL2 not supported");

    // make a basic scene graph
    let sphere_scene = new SceneGraph(canvas); // create a top level scene root with top level objects
    // scene.add_object(cake_flat); // add to the scene graph
    // scene.add_object(cake_gouraud); // add to the scene graph
    // scene.add_object(cake_phong); // add to the scene graph
    sphere_scene.add_point_light_global([0, 5, 5]); // just to have a base light
    sphere_scene.add_object(new SphereGen.SphereObject("test", gl)); // add a crappy sphere to the scene
    function get_silver_lighting() {
      return {
        "ka": [0.19225, 0.19225, 0.19225],
        "kd": [0.50754, 0.50754, 0.50754],
        "ks": [0.508273, 0.508273, 0.508273],
        "alpha": 51.2,
        "transparency": 1.0
      }
    } // end function
    sphere_scene.update_material_global("test", get_silver_lighting());
    


    const start_time = Date.now() // start the clock 
    let delta_time;

    /**
     * render the scene.
     */
    function render() {
      // TODO
      delta_time = (Date.now() - start_time) / 1000
      // TODO i hate this system, will be changing, just testing to see if this restructure is working.
      sphere_scene.render({
        "test": {
          "sphere_root": {
            "dynamic_transforms": [],
            "joint_transforms": []
          }
        }
      });
    } // end render

    // Initialize when page loads
    window.onload = function () {
      setInterval(render, 30); // execute this code with a 30 ms delay on each call
    }

  </script>
