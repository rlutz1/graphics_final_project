  <!-- keep track of pressed/unpressed/general tracking in a dict -->
  <!-- passed to scene on render call. we can customize what's held -->
  <!-- here as needed. -->
  <script>
    // adding some basic defaults at first, will dynamically add 
    // as more things keydown/keyup.
    const frontend_data = {
      "w": false,
      "a": false,
      "s": false,
      "d": false,
      mouse_x: 0,
      mouse_y: 0,
      shoot: false
    };

    // example: keys.w = true on pressing
    window.addEventListener('keydown', (event) => {
      frontend_data[event.key] = true;
    });

    // example: keys.w = false on not pressing
    window.addEventListener('keyup', (event) => {
      frontend_data[event.key] = false;
    });

    // for use in event handling/ui -- returns 
    // position with x growing left to right, 0 -> w
    // and y growing top to bottom, 0 -> h
    function getMousePosition(canvas, event) {
            let rect = canvas.getBoundingClientRect();
            let x = event.clientX - rect.left;
            let y = event.clientY - rect.top;
            return {x: x, y: y}
    } // end function

    // ADDED BY THEO BUT AS EXPLAINED BELOW COMMENTED OUT BECAUSE I COULD NOT GET IT WORKING
    // FPS mouse style, track movement between frame, accumulating movement until next render call
    /*
    let mouseDX = 0;
    let mouseDY = 0;

    // Mouse sensitivity controls how quickly the camera rotates.
    // Larger values = faster camera movement.
    const mouseSensitivity = 0.002;*/
    
  </script>


  <!-- ======================================================= -->
  <!-- MAIN RENDER LOOP                                        -->
  <!-- ======================================================= -->

  <script type="module">
    import { Renderer } from "./util/scene_graph.js";

    // WebGL context setup
    const canvas = document.getElementById("glcanvas");
    const gl = canvas.getContext("webgl2");
    if (!gl) alert("WebGL2 not supported");
        const aspect = canvas.width / canvas.height;

    // commenting out as it kind of breaks the fps style mouse, but will maybe need it for space?
    // breaks it because we need the pointer lock, but that uses relative coord, not absolute
    //get mouse position on screen for whatever you need.
    
    /*canvas.addEventListener('mousemove', (event) => {
      const pos = getMousePosition(canvas, event);

      frontend_data.mouse_x = pos.x;
      frontend_data.mouse_y = pos.y;
    });*/ 

    
  // THEO CHANGES TO MOUSE BEHAVIOR BELOW:
    canvas.addEventListener("click", () => {
      if (document.pointerLockElement !== canvas) {
        canvas.requestPointerLock();
        return;
    }

      frontend_data.shoot = true;
    });
    let mouseY = canvas.height / 2;
    let mouseX = canvas.width / 2;

    document.addEventListener("mousemove", (event) => {
      if (document.pointerLockElement === canvas) {
        mouseY += event.movementY;
        mouseX += event.movementX;

        // Clamp vertical look to the canvas
        mouseY = Math.max(0, Math.min(canvas.height, mouseY));
        mouseX = Math.max(0, Math.min(canvas.width, mouseX));
      }
    });
    // END CHANGES

    let curr_scene = null; // the current scene to be rendered.
    let next_scene = null; // next scene up in the queue to be rendered.

    // go ahead and grab any assets from any scene's needed here.
    import * as OuterSpaceBuilder from "../outer_world/outer_space_scene.js";
    import * as EarthBuilder from "../planetary_duck_hunt/earth_scene.js";

    // create an earth and space scene to start
    const space = new OuterSpaceBuilder.OuterSpaceScene();

    // i'm just going to let space have this html element to update, lol
    const hit_points = document.getElementById("hit_points");
    space.hit_point_ui_el = hit_points;
    const curr_location = document.getElementById("current_location");
    space.location_ui_el = curr_location;


     /**
     * rendering manager is a lightweight, simple
     * iteration to (1) update all nodes' transformation matrices
     * and (2) coordinate the correct shader for the node.
     * this is intended to be incredibly simple and should stay so.
     * any scene given to render(scene) should *just work*.
     */ 
    const renderer = new Renderer(gl);
    
    // going to set this as the default one being used for the moment:
    // (but uncomment and switch as needed, please be aware when pushing to main about this)
    //curr_scene = earth;
    //next_scene = space;

    // for potential transition testing.
    curr_scene = space;
    next_scene = null; 

    // map scene names to the instantiator? something like this? placeholder for now.
    const planet_scenes = {
      "mercury": EarthBuilder.EarthScene,
      "venus": EarthBuilder.EarthScene,
      "earth": EarthBuilder.EarthScene,
      "mars": EarthBuilder.EarthScene,
      "jupiter": EarthBuilder.EarthScene,
      "saturn": EarthBuilder.EarthScene,
      "uranus": EarthBuilder.EarthScene,
      "neptune": EarthBuilder.EarthScene
    };

    const cleared_planets = []; // global to add to for indicating ui and making sure game logic loop closed
    const cleared_planet_scenes = {
      "mercury": null,
      "venus": null,
      "earth": null,
      "mars": null,
      "jupiter": null,
      "saturn": null,
      "uranus": null,
      "neptune": null
    };

    // add leave button click action; planet stuff 
    const leave_button = document.getElementById("leave");
    const planet_div = document.getElementById("planet_div");
    leave_button.addEventListener("click", () => {
      curr_location.innerText = `Returning to space...`;
      frontend_data.leave = true;
    });

    curr_scene.init(renderer, aspect); // initialize the scene.
    
    let start_time = null;
    let last_time = null;
    let delta_time;
    let time_since_last_render;

    /**
     * render the scene.
     */
    async function render(timestep) {
      if (!start_time) { start_time = timestep; }
      if (!last_time) { last_time = timestep; }
      delta_time = (timestep - start_time) / 1000 // dt in seconds from front end
      time_since_last_render = (timestep - last_time) / 1000; last_time = timestep; // tracking times since last render as well
      frontend_data.delta_time = delta_time; // TOTAL time elapsed
      frontend_data.time_since_last_render = time_since_last_render; // time SINCE the last render
      frontend_data.canvas_width = canvas.width; // add the canvas information for mouse interaction with the screen.
      frontend_data.canvas_height = canvas.height;
      frontend_data.mouse_y = mouseY; // for theo/planet, no touchy
      frontend_data.mouse_x = mouseX;

      // console.log(frontend_data); // TESTING

      // TODO: this could be a potential simple transition between scenes. 
      // note that the curr_scene.initialized is there primarily for the space 
      // scene: it's very likely we don't want to re-call that for that scene.
      // a thought, but not required.

      
      if (curr_scene.is_over) {
        renderer.clear([0, 0, 0]); // clear out
        
        if (curr_scene === space) { // if going from space -> planet
          const planet_name = curr_scene.transition.planet.toLowerCase(); // readable name of the planet, trust
          // console.log(planet_name); // testing
          const cleared = cleared_planets.some(item => item === planet_name); // planet cleared

          if (cleared) { // if cleared, load the empty planet
            curr_scene = cleared_planet_scenes[planet_name]; // grab the old scene that is empty.
          } else {
            // re-make the scene, either its cleared or not. no in between right now.
            const PlanetSceneClass = planet_scenes[planet_name];
            curr_scene = new PlanetSceneClass();
            await curr_scene.init(renderer, aspect);
          } // end if

          // ui updates
          hit_points.style.display = "none"; // ensure invisible
          planet_div.style.display = "block"; // display vs not
          leave_button.textContent = `Leave ${curr_scene.name}`;

          space.reset(); // reset some stuff in space so transition back is smooth

        } else { // if going from planet -> space
        
          if (curr_scene.cleared) { // have cleared the planet on this run
            cleared_planets.push(curr_scene.name.toLowerCase()); // push this planet to the cleared list
            cleared_planet_scenes[curr_scene.name.toLowerCase()] = curr_scene; // hold on to this object for later
          } else {
            // ANYTHING HERE??
          } // end if

          curr_scene = space; // reset to space

          // ui updates
          hit_points.style.display = "block"; // ensure visible
          planet_div.style.display = "none";
        } // end if
        // ensure updated regardless
        curr_location.innerText = `Current Location: ${curr_scene.name}`;
      } // end if
      


      // if (curr_scene.is_over) { // some sort of switch to next flag set by game logic.
      //   renderer.clear([0, 0, 0]);
      //   curr_scene.reset(); // does something with space, nothing on earth rn

      //   const temp_scene = curr_scene;
      //   curr_scene = next_scene;
      //   next_scene = temp_scene;
      //   if (curr_scene !== space) {
      //     // this is not super cool, but it'll work with a basic timing mechanic.
      //     // re-running init was causing some funky shit, so, in name of time:
      //     curr_scene = new EarthBuilder.EarthScene();
      //     await curr_scene.init(renderer, aspect);
      //     hit_points.style.display = "none"; // ensure invisible
      //     planet_div.style.display = "block"; // display vs not
      //     leave_button.textContent = `Leave ${curr_scene.name}`;
      //   } else {
      //     hit_points.style.display = "block"; // ensure visible
      //     planet_div.style.display = "none";
      //   } // end if
      //   // regardless, update location
      //   curr_location.innerText = `Current Location: ${curr_scene.name}`;
      // } // end if
   
      curr_scene.render(frontend_data);

      // frontend_data.shoot = false; // RESET for now
      frontend_data.leave = false; // reset as well
  
      requestAnimationFrame(render);
    } // end render

    // // MODIFIED BY THEO
    // // Initialize the scene before starting the render loop.
    // // Awaiting init ensures the WASM module and boid data are ready.
    // async function startGame() {
    //   await curr_scene.init(renderer, aspect);

    //   requestAnimationFrame(render);
    // }

    // startGame();

    // Initialize when page loads
    window.onload = function () {
      requestAnimationFrame(render);
    }

  </script>
